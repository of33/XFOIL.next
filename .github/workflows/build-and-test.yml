name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
            buildroot: build/ci-gcc
          - compiler: Clang
            cxx: clang++
            buildroot: build/ci-clang
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ clang gfortran make valgrind python3

      - name: Environment contract
        run: |
          set -eu
          g++ --version | head -n1
          clang++ --version | head -n1
          gfortran --version | head -n1
          make --version | head -n1
          getconf GNU_LIBC_VERSION
          test "$(g++ -dumpfullversion | cut -d. -f1)" = 13 \
            || { echo "FAIL: unexpected g++ major version"; exit 1; }
          test "$(gfortran -dumpversion | cut -d. -f1)" = 13 \
            || { echo "FAIL: unexpected GNU Fortran major version"; exit 1; }
          test "$(clang++ -dumpversion | cut -d. -f1)" = 18 \
            || { echo "FAIL: unexpected clang major version"; exit 1; }
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.39" \
            || { echo "FAIL: unexpected GNU libc version"; exit 1; }

      - name: Debug build
        run: make debug CXX=${{ matrix.cxx }} BUILDROOT=${{ matrix.buildroot }}

      - name: Release build
        run: make release CXX=${{ matrix.cxx }} BUILDROOT=${{ matrix.buildroot }}

      - name: Core tests
        run: make test-core CXX=${{ matrix.cxx }} BUILDROOT=${{ matrix.buildroot }}

      - name: Unit tests
        run: make test-unit CXX=${{ matrix.cxx }} BUILDROOT=${{ matrix.buildroot }}

      - name: Integration tests
        env:
          XFOIL_CLI_PATH: ${{ matrix.buildroot }}/debug/xfoil.next
        run: make test-integration CXX=${{ matrix.cxx }} BUILDROOT=${{ matrix.buildroot }}

      - name: Regression tests
        run: make test-regression CXX=${{ matrix.cxx }} BUILDROOT=${{ matrix.buildroot }}

      - name: Batch tests
        run: make test-batch CXX=${{ matrix.cxx }} BUILDROOT=${{ matrix.buildroot }}

      - name: Full test suite
        run: make test CXX=${{ matrix.cxx }} BUILDROOT=${{ matrix.buildroot }}

  validation:
    name: Gates, reference, harnesses, sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ gfortran make python3 xfonts-base xvfb

      - name: Environment contract
        run: |
          set -eu
          g++ --version | head -n1
          gfortran --version | head -n1
          make --version | head -n1
          getconf GNU_LIBC_VERSION
          test "$(g++ -dumpfullversion | cut -d. -f1)" = 13 \
            || { echo "FAIL: unexpected g++ major version"; exit 1; }
          test "$(gfortran -dumpversion | cut -d. -f1)" = 13 \
            || { echo "FAIL: unexpected GNU Fortran major version"; exit 1; }
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.39" \
            || { echo "FAIL: unexpected GNU libc version"; exit 1; }
          command -v xvfb-run >/dev/null \
            || { echo "FAIL: xvfb-run missing (headless display server)"; exit 1; }
          dpkg-query -W -f='${Status}\n' xfonts-base |
            grep -Fx 'install ok installed' \
            || { echo "FAIL: xfonts-base not installed (X core fonts)"; exit 1; }
          test -d /usr/share/fonts/X11 \
            || { echo "FAIL: /usr/share/fonts/X11 missing"; exit 1; }
          find /usr/share/fonts/X11 -type f -print -quit | grep -q . \
            || { echo "FAIL: no X font files present"; exit 1; }

      - name: check-dependencies
        run: make check-dependencies

      - name: check-fortran-sha
        run: make check-fortran-sha

      - name: check-release-inventory
        run: make check-release-inventory

      - name: check-license-headers
        run: make check-license-headers

      - name: check-public-docs
        run: make check-public-docs

      - name: core-link-check
        run: make core-link-check

      - name: session-link-check
        run: make session-link-check

      - name: Fortran reference verify
        run: xvfb-run -a make test-reference

      - name: Fortran reference determinism
        run: xvfb-run -a make test-reference-determinism

      - name: Harness families
        run: xvfb-run -a make test-harnesses

      - name: Sanitizer build and test
        run: make test-sanitize

  valgrind:
    name: Valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make valgrind

      - name: Environment contract
        run: |
          set -eu
          g++ --version | head -n1
          make --version | head -n1
          getconf GNU_LIBC_VERSION
          test "$(g++ -dumpfullversion | cut -d. -f1)" = 13 \
            || { echo "FAIL: unexpected g++ major version"; exit 1; }
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.39" \
            || { echo "FAIL: unexpected GNU libc version"; exit 1; }

      - name: Build debug and core targets
        run: |
          make debug BUILDROOT=build/ci-valgrind
          make core-link-check BUILDROOT=build/ci-valgrind
          make session-link-check BUILDROOT=build/ci-valgrind

      - name: Valgrind
        run: make test-valgrind BUILDROOT=build/ci-valgrind
